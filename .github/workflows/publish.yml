name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on master (stable releases only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          if [[ "$TAG_VERSION" == *-* ]]; then
            echo "Tag $GITHUB_REF looks like a pre-release/preview version ($TAG_VERSION)."
            echo "Preview tags are allowed to be pushed from any branch. Skipping master check."
            exit 0
          fi

          git fetch origin master --depth=1000
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "Tag $GITHUB_REF points to a commit that is on master. Proceeding."
          else
            echo "Tag $GITHUB_REF points to a commit that is NOT on master (likely a feature branch)."
            echo "Publishing stable (non-preview) tags is only allowed for tags created on/merged into master. Aborting."
            echo "If you intended a preview release, use a version with a pre-release suffix, e.g. v0.2.0-preview.1"
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore PlaxionMediator.sln

      - name: Build
        run: dotnet build PlaxionMediator.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test PlaxionMediator.sln --configuration Release --no-build --verbosity normal

      - name: Pack
        run: |
          # Extract version from tag (remove 'v' prefix). For manual workflow_dispatch runs
          # (no tag), fall back to a timestamped preview version.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="0.1.0-preview.$(date +%Y%m%d%H%M%S)"
          fi
          echo "Packing version $VERSION"
          dotnet pack PlaxionMediator.sln --configuration Release --output nupkgs /p:Version=$VERSION

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: avmp2208

      - name: Push to NuGet.org
        run: dotnet nuget push "nupkgs/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
