name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x

      - name: Restore
        run: dotnet restore PlaxionMediator.sln

      - name: Build
        run: dotnet build PlaxionMediator.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test PlaxionMediator.sln --no-build --configuration Release --verbosity normal
